<!doctype html>
<html>
  <head>
    <base target="_top" />
    <link
      rel="stylesheet"
      href="https://ssl.gstatic.com/docs/script/css/add-ons1.css"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Monaco, monospace;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 90%;
        padding: 20px;
      }
      .instructions {
        font-size: 12px;
        font-style: italic;
        margin-bottom: 15px;
        width: 100%;
        text-align: center;
        color: #666;
      }
      form {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }
      label {
        margin: 10px 0 5px;
        font-weight: bold;
      }
      .required:after {
        content: " *";
        color: red;
      }
      select {
        padding: 8px;
        margin-bottom: 15px;
        height: auto;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 13px;
        width: 100%;
        box-sizing: border-box;
      }
      .submit-container {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        position: relative;
        margin-top: 10px;
      }
      .submit-button {
        padding: 10px 15px;
        height: auto;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
      }
      .submit-button:hover {
        background: #45a049;
        color: white;
      }
      .submit-button.secondary {
        background: #2196F3;
      }
      .submit-button.secondary:hover {
        background: #0b7dda;
      }
      .submit-button[disabled] {
        background: #ccc;
        cursor: not-allowed;
      }
      .submit-button.hide-text {
        color: transparent;
      }
      .err {
        border: 2px solid red !important;
      }
      .spinner {
        display: none;
        border: 4px solid rgba(0, 0, 0, 0.1);
        border-radius: 50%;
        border-top: 4px solid #0000ff;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        position: absolute;
      }
      .submit-button.hide-text .spinner {
        display: block;
      }
      .success-message {
        display: none;
        margin-top: 20px;
        padding: 15px;
        background: #d4edda;
        border: 1px solid #c3e6cb;
        border-radius: 4px;
        color: #155724;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
      }
      .success-message a {
        color: #155724;
        font-weight: bold;
      }
      .error-message {
        display: none;
        margin-top: 20px;
        padding: 15px;
        background: #f8d7da;
        border: 1px solid #f5c6cb;
        border-radius: 4px;
        color: #721c24;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="instructions">
        Select an invoice to generate a PDF
      </div>
      <form id="inputForm">
        <label for="invoiceSelect" class="required">Invoice</label>
        <select id="invoiceSelect" name="invoiceSelect" required>
          <option value="" disabled selected>Loading invoices...</option>
        </select>
        <div class="submit-container">
          <button type="button" class="submit-button" onclick="submitForm(false)">
            Standard Invoice
            <div class="spinner" id="spinner1"></div>
          </button>
          <button type="button" class="submit-button secondary" onclick="submitForm(true)">
            With Processing Fee
            <div class="spinner" id="spinner2"></div>
          </button>
        </div>
      </form>
      <div id="successMessage" class="success-message"></div>
      <div id="emailMessage" style="display:none; margin-top:10px; padding:10px; background:#d4edda; border:1px solid #c3e6cb; border-radius:4px; color:#155724; text-align:center; width:100%; box-sizing:border-box; font-size:13px;"></div>
      <div id="errorMessage" class="error-message"></div>
    </div>
    <script>
      // Load invoices on page load
      window.onload = () => {
        google.script.run
          .withSuccessHandler(populateInvoiceDropdown)
          .withFailureHandler(showError)
          .getInvoicesForDialog();
      };

      const populateInvoiceDropdown = (invoices) => {
        const select = document.getElementById("invoiceSelect");
        select.innerHTML = '<option value="" disabled selected>Select an invoice</option>';

        invoices.forEach((invoice) => {
          const option = document.createElement("option");
          option.value = invoice.rowNumber;
          option.textContent = invoice.displayText;
          select.appendChild(option);
        });
      };

      const submitForm = (includeFee) => {
        const requiredFields = document.querySelectorAll("[required]");
        let allFieldsValid = true;
        let errorMessage = "Please correct the following errors:\n";

        requiredFields.forEach((field) => {
          if (!field.value || field.value === "") {
            field.classList.add("err");
            allFieldsValid = false;
            errorMessage += `- Please select an invoice.\n`;
          } else {
            field.classList.remove("err");
          }
        });

        if (!allFieldsValid) {
          alert(errorMessage);
          return;
        }

        // Show loading state for all buttons
        const submitButtons = document.querySelectorAll(".submit-button");
        submitButtons.forEach(button => {
          button.classList.add("hide-text");
          button.disabled = true;
        });

        // Show appropriate spinner
        const spinnerId = includeFee ? "spinner2" : "spinner1";
        document.getElementById(spinnerId).style.display = "block";
        document.getElementById("invoiceSelect").disabled = true;

        // Hide previous messages
        document.getElementById("successMessage").style.display = "none";
        document.getElementById("errorMessage").style.display = "none";

        const rowNumber = parseInt(document.getElementById("invoiceSelect").value);

        google.script.run
          .withSuccessHandler(handleSuccess)
          .withFailureHandler(handleError)
          .handleInvoiceExport(rowNumber, includeFee);
      };

      let _lastResult = null;

      const handleSuccess = (result) => {
        hideSpinner();

        if (result.success) {
          _lastResult = result;
          const successDiv = document.getElementById("successMessage");
          successDiv.innerHTML = `
            ${result.message}<br>
            <a href="${result.pdfUrl}" target="_blank">Open Invoice PDF</a><br><br>
            <button type="button" class="submit-button secondary" style="width:auto; padding:8px 16px; font-size:13px; margin:0 auto;" onclick="sendEmail()">
              Send Email to Client
            </button>
          `;
          successDiv.style.display = "block";
          document.getElementById("invoiceSelect").selectedIndex = 0;
        } else {
          showError(result.message);
        }
      };

      const sendEmail = () => {
        if (!_lastResult) return;
        const btn = document.querySelector('#successMessage .submit-button');
        btn.disabled = true;
        btn.textContent = 'Sending…';

        google.script.run
          .withSuccessHandler((res) => {
            btn.disabled = false;
            btn.textContent = 'Send Email to Client';
            const emailMsg = document.getElementById("emailMessage");
            if (res.success) {
              emailMsg.textContent = 'Email sent to client.';
            } else {
              emailMsg.textContent = 'Email failed: ' + (res.message || 'unknown error');
              emailMsg.style.background = '#f8d7da';
              emailMsg.style.borderColor = '#f5c6cb';
              emailMsg.style.color = '#721c24';
            }
            emailMsg.style.display = 'block';
          })
          .withFailureHandler((err) => {
            btn.disabled = false;
            btn.textContent = 'Send Email to Client';
            const emailMsg = document.getElementById("emailMessage");
            emailMsg.textContent = 'Email failed: ' + (err.message || err.toString());
            emailMsg.style.background = '#f8d7da';
            emailMsg.style.borderColor = '#f5c6cb';
            emailMsg.style.color = '#721c24';
            emailMsg.style.display = 'block';
          })
          .handleSendInvoiceEmail(_lastResult.rowNumber, _lastResult.includeFee, _lastResult.pdfFileId, _lastResult.pdfUrl);
      };

      const handleError = (error) => {
        hideSpinner();
        showError(error.message || error.toString());
      };

      const showError = (message) => {
        const errorDiv = document.getElementById("errorMessage");
        errorDiv.textContent = message;
        errorDiv.style.display = "block";
      };

      const hideSpinner = () => {
        const submitButtons = document.querySelectorAll(".submit-button");
        submitButtons.forEach(button => {
          button.classList.remove("hide-text");
          button.disabled = false;
        });
        document.getElementById("spinner1").style.display = "none";
        document.getElementById("spinner2").style.display = "none";
        document.getElementById("invoiceSelect").disabled = false;
      };
    </script>
  </body>
</html>
